version: "3"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

vars:
  APP_NAME: "MaaGO"
  BIN_DIR: "bin"
  VITE_PORT: "{{.WAILS_VITE_PORT | default 1145}}"

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Builds a production binary
    cmds:
      - task: "{{OS}}:build"
        vars:
          PRODUCTION: "true"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  build:rdp-controlunit:
    summary: Builds the custom MaaWin32ControlUnit used by RDP mode
    cmds:
      - powershell -ExecutionPolicy Bypass -File scripts/build-rdp-controlunit.ps1

  install:rdp-controlunit:
    summary: Installs the RDP control unit into a MaaCore directory
    vars:
      CORE_DIR: '{{.CORE_DIR | default "core"}}'
    cmds:
      - powershell -ExecutionPolicy Bypass -File scripts/install-rdp-controlunit.ps1 -CoreDir "{{.CORE_DIR}}"
