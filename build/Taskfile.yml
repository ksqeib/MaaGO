version: "3"

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Installs frontend dependencies
    dir: frontend
    method: timestamp
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    status:
      - test -f node_modules/.package-lock.json
    cmds:
      - npm install

  build:frontend:
    summary: Builds the frontend
    dir: frontend
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - npm run {{.BUILD_COMMAND}}
    vars:
      BUILD_COMMAND: '{{if eq .PRODUCTION "true"}}build{{else}}build:dev{{end}}'

  generate:bindings:
    summary: Generates typed frontend bindings
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true

  dev:frontend:
    summary: Runs the Vite dev server
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - npm run dev -- --host 127.0.0.1 --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Regenerates Windows build metadata
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
