# Wails v3 project configuration.
# Run `wails3 task common:update:build-assets` after changing `info`.
version: "3"

info:
  companyName: "MaaGO"
  productName: "MaaGO"
  productIdentifier: "org.maago.desktop"
  description: "MaaAssistantArknights desktop companion"
  copyright: "(c) 2026, MaaGO contributors"
  comments: ""
  version: "0.1.0"
  beta: "true"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 800
  ignore:
    dir:
      - .git
      - .idea
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
      - "*.tsx"
      - "*.jsx"
    git_ignore: true
  executes:
    - cmd: wails3 task build
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations:

other:
